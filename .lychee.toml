# Lychee Link Checker Configuration
# Documentation: https://lychee.cli.rs/

# Root directory for resolving absolute / root-relative URLs (e.g. /components/asides/)
root_dir = "./dist"

# Verbose program output ("error", "warn", "info", "debug", "trace")
verbose = "info"

# Maximum number of allowed retries before a link is declared dead
max_retries = 3

# Website timeout from connect to response finished (in seconds)
timeout = 20

# Accepted status codes for valid links
accept = ["200..=204", "206", "429"]

# Exclude loopback and private networks
exclude_all_private = true

# Exclude specific external domains or URLs that block automated CI bots or scrapers
exclude = [
  # LinkedIn blocks automated CI crawlers with HTTP 999 / 403
  'https://www\.linkedin\.com/.*',
  # The 404 error page canonical URL naturally returns a 404 status from the live server
  '^https?://docs\.timothyjohnsonwrites\.com/404/?$',
  # GitHub "Edit page" links redirect to login when accessed unauthenticated
  'https://github\.com/write-tim/docs-as-code/edit/.*',
  # Local development URLs
  '^https?://localhost.*',
  '^https?://127\.0\.0\.1.*',
  # Social platforms that rate-limit or block headless bots
  'https://twitter\.com/.*',
  'https://x\.com/.*',
]

