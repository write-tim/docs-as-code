<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Blend TJ Red into Tech Blue -->
    <linearGradient id="docsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Floating Layer -->
  <rect x="120" y="60" width="200" height="260" rx="16" fill="url(#docsGradient)" opacity="0.1" />
  
  <!-- Middle Floating Layer -->
  <rect x="90" y="90" width="200" height="260" rx="16" fill="url(#docsGradient)" opacity="0.25" />
  
  <!-- Foreground Outline Layer -->
  <rect x="60" y="120" width="200" height="260" rx="16" fill="none" stroke="url(#docsGradient)" stroke-width="6" />
  
  <!-- UI Document Details -->
  <circle cx="95" cy="160" r="8" fill="#FF1A1A" opacity="0.8" />
  <circle cx="125" cy="160" r="8" fill="#FF1A1A" opacity="0.5" />
  <circle cx="155" cy="160" r="8" fill="#FF1A1A" opacity="0.2" />
  
  <line x1="95" y1="310" x2="225" y2="310" stroke="url(#docsGradient)" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  <line x1="95" y1="340" x2="185" y2="340" stroke="url(#docsGradient)" stroke-width="8" stroke-linecap="round" opacity="0.6" />

  <!-- The Code Symbol -->
  <text x="160" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="76" font-weight="900" fill="url(#docsGradient)" filter="url(#glow)" letter-spacing="-4">&lt;/&gt;</text>
</svg>
