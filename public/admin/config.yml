backend:
  name: github
  repo: write-tim/docs-as-code 
  branch: main
  site_domain: docs.timothyjohnsonwrites.com
  base_url: https://sveltia-gatekeeper.onrender.com
  auth_endpoint: auth

media_folder: "src/assets/images"
public_folder: "@/assets/images"
show_preview_links: true

# ---------------------------------------------------------
# Define reusable fields block using a YAML anchor (&)
# ---------------------------------------------------------
.docs_fields: &DOCS_FIELDS
  - label: "Title"
    name: "title"
    widget: "string"
    required: true
    hint: "The main page H1 heading and browser title."
  - label: "Description"
    name: "description"
    widget: "string"
    required: false
    hint: "Used for search indexing and social meta tags."
  - label: "Sidebar Navigation"
    name: "sidebar"
    widget: "object"
    required: false
    collapsed: true
    fields:
      - label: "Sidebar Label"
        name: "label"
        widget: "string"
        required: false
      - label: "Sort Order"
        name: "order"
        widget: "number"
        value_type: "int"
        required: false
      - label: "Hidden from Sidebar"
        name: "hidden"
        widget: "boolean"
        default: false
      - label: "Sidebar Badge"
        name: "badge"
        widget: "object"
        required: false
        fields:
          - label: "Badge Text"
            name: "text"
            widget: "string"
          - label: "Variant"
            name: "variant"
            widget: "select"
            options: ["note", "tip", "caution", "danger", "success"]
            default: "tip"
  - label: "Table of Contents"
    name: "tableOfContents"
    widget: "object"
    required: false
    collapsed: true
    fields:
      - label: "Min Heading Level"
        name: "minHeadingLevel"
        widget: "number"
        default: 2
      - label: "Max Heading Level"
        name: "maxHeadingLevel"
        widget: "number"
        default: 3
  - label: "Body Content"
    name: "body"
    widget: "markdown"
    required: true
    editor_components:
      - aside
      - steps
      - filetree
      - badge
      - tabs

# ---------------------------------------------------------
# Define individual collections mapped to subfolders
# ---------------------------------------------------------
collections:
  - name: "docs_root"
    label: "Docs - Root (Homepage)"
    label_singular: "Root Page"
    folder: "src/content/docs"
    extension: "mdx"
    format: "frontmatter"
    create: true
    delete: true
    summary: "{{title}}"
    fields: *DOCS_FIELDS

  - name: "docs_automation"
    label: "Docs - Automation"
    label_singular: "Automation Article"
    folder: "src/content/docs/automation"
    extension: "mdx"
    format: "frontmatter"
    create: true
    delete: true
    summary: "{{title}} ({{sidebar.order | default: '-'}})"
    sortable_fields: ["sidebar.order", "title", "commit_date"]
    fields: *DOCS_FIELDS

  - name: "docs_cms"
